<!DOCTYPE html>
<html lang="en">
<head>
<script src="/assets/gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seitiate Estate — Wheels Within Wheels</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0c10;color:#c8d0dc;font-family:'Space Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

<body>
<a href="/" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(14,16,21,0.85);border:1px solid rgba(57,255,20,0.35);color:#39ff14;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);text-decoration:none;">← Seitiate</a>
<div id="app"></div>
<template id="t">

<div style="position:fixed;inset:0;display:flex;flex-direction:column;background:#0a0c10">

  <div data-estate-stage="1" ref="{{ stageRef }}" onClick="{{ onStage }}" style="position:relative;flex:1;min-height:0;overflow:hidden;cursor:{{ stageCursor }};background:radial-gradient(circle at 50% 52%, rgba(57,255,20,0.045), transparent 52%)">

    <sc-for list="{{ rings }}" as="r" hint-placeholder-count="7">
      <div style="position:absolute;left:0;top:0;width:{{ r.w }}px;height:{{ r.h }}px;border-radius:50%;border:1px {{ r.dash }} rgba(57,255,20,0.11);transform:{{ r.tf }};opacity:{{ r.o }};pointer-events:none;transition:transform 720ms cubic-bezier(0.4,0,0.2,1), width 720ms cubic-bezier(0.4,0,0.2,1), height 720ms cubic-bezier(0.4,0,0.2,1), opacity 600ms cubic-bezier(0.4,0,0.2,1)"></div>
    </sc-for>

    <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="0">
      <div style="position:absolute;left:0;top:0;height:1px;width:{{ ln.w }}px;transform:{{ ln.tf }};transform-origin:0 50%;background:{{ ln.bg }};pointer-events:none"></div>
    </sc-for>

    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="7">
      <button type="button" aria-label="{{ n.aria }}" onClick="{{ n.onClick }}" style="position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;background:{{ n.bg }};border:{{ n.border }};box-shadow:{{ n.shadow }};transform:{{ n.tf }};opacity:{{ n.o }};pointer-events:{{ n.pe }};cursor:pointer;transition:transform 720ms cubic-bezier(0.4,0,0.2,1), opacity 600ms cubic-bezier(0.4,0,0.2,1), background 250ms, box-shadow 400ms;will-change:transform" style-hover="filter:brightness(1.45)"></button>
      <div style="position:absolute;left:0;top:0;width:{{ n.lw }}px;transform:{{ n.ltf }};opacity:{{ n.lo }};pointer-events:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform 720ms cubic-bezier(0.4,0,0.2,1), opacity 420ms cubic-bezier(0.4,0,0.2,1)">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;color:{{ n.kc }}">{{ n.kicker }}</div>
        <div style="font-size:{{ n.fs }}px;line-height:1.18;font-weight:500;letter-spacing:-0.01em;color:{{ n.nc }};text-wrap:balance">{{ n.name }}</div>
        <sc-if value="{{ n.counts }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a8b1be;margin-top:2px">
            <span style="display:flex;align-items:center;gap:3px"><span style="width:5px;height:5px;border-radius:50%;background:#39ff14"></span>{{ n.cl }}</span>
            <span style="display:flex;align-items:center;gap:3px"><span style="width:5px;height:5px;border-radius:50%;background:#d4a574"></span>{{ n.cf }}</span>
            <span style="display:flex;align-items:center;gap:3px"><span style="width:5px;height:5px;border-radius:50%;border:1px dashed #60a5fa"></span>{{ n.cp }}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div onClick="{{ stop }}" style="position:absolute;left:{{ cx }}px;top:{{ cy }}px;width:{{ lensW }}px;height:{{ lensH }};max-height:{{ lensMaxH }}px;border-radius:{{ lensR }};background:#0e1015;border:1px solid {{ lens.bc }};box-shadow:0 0 0 1px rgba(10,12,16,1), 0 0 80px {{ lens.glow }};transform:{{ lensTf }};opacity:{{ lensO }};pointer-events:{{ lensPE }};transition:{{ lensTr }};display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default">
      <div style="width:{{ innerW }}px;max-height:{{ innerH }}px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#161a22 transparent;mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)">
      <div style="padding:22px 2px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#a8b1be">{{ lens.eyebrow }}</div>
          <div style="font-size:24px;line-height:1.18;font-weight:500;letter-spacing:-0.02em;color:#c8d0dc;text-wrap:balance">{{ lens.title }}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;padding:3px 9px;border-radius:100px;border:1px {{ lens.dash }} {{ lens.sc }};color:{{ lens.sc }};white-space:nowrap">{{ lens.stLabel }}</span>
            <sc-if value="{{ lens.noChip }}" hint-placeholder-val="{{ false }}"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;padding:3px 9px;border-radius:100px;border:1px solid rgba(200,208,220,0.25);color:#c8d0dc;white-space:nowrap">Partner Vertical TOUCHPOINT</span></sc-if>
          </div>
        </div>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#c8d0dc;text-wrap:pretty">{{ lens.desc }}</p>
        <sc-if value="{{ lens.hasNotes }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:7px">
            <sc-for list="{{ lens.notes }}" as="nt" hint-placeholder-count="0">
              <div style="display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.55;color:#a8b1be"><span style="width:4px;height:4px;margin-top:8px;background:#39ff14;opacity:0.6"></span><span style="text-wrap:pretty">{{ nt }}</span></div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ lens.hasLoop }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#39ff14;padding:4px 10px;border:1px solid rgba(57,255,20,0.25);border-radius:3px">{{ lens.loop }}</div>
        </sc-if>
        <sc-if value="{{ lens.hasStage }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid rgba(57,255,20,0.08)">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;color:#8b95a3">WHERE IT STANDS</div>
            <div style="font-size:13.5px;line-height:1.55;color:#a8b1be;text-wrap:pretty">{{ lens.stage }}</div>
          </div>
        </sc-if>
        <sc-if value="{{ lens.hasCloser }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ toggleCloser }}" style="align-self:center;min-height:44px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#39ff14;padding:6px 12px">{{ closerLabel }}</button>
        </sc-if>
        <sc-if value="{{ lens.hasBounds }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(57,255,20,0.08)">
            <sc-for list="{{ lens.bounds }}" as="b" hint-placeholder-count="0">
              <div style="display:flex;flex-direction:column;gap:2px">
                <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;color:#8b95a3;text-transform:uppercase">{{ b.k }}</div>
                <div style="font-size:13.5px;line-height:1.5;color:#a8b1be;text-wrap:pretty">{{ b.v }}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;border-top:1px solid rgba(57,255,20,0.08)">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;color:#8b95a3">{{ lens.linkTitle }}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
            <sc-for list="{{ lens.links }}" as="lk" hint-placeholder-count="0">
              <button type="button" onClick="{{ lk.onClick }}" style="display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#c8d0dc;background:#161a22;border:1px solid rgba(57,255,20,0.08);border-radius:3px;padding:5px 8px;transition:all 150ms" style-hover="background:rgba(57,255,20,0.12);border-color:#39ff14;color:#39ff14"><span style="width:6px;height:6px;border-radius:50%;background:{{ lk.c }}"></span>{{ lk.name }}<span style="color:#8b95a3">{{ lk.dom }}</span></button>
            </sc-for>
          </div>
        </div>
        <button type="button" onClick="{{ back }}" style="align-self:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#a8b1be;padding:6px 10px" style-hover="color:#39ff14">← ZOOM OUT</button>
      </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:0;padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;z-index:20">
    <div style="display:flex;align-items:center;gap:14px;pointer-events:auto">
      <div style="position:relative;width:58px;height:58px;flex:none">
        <button type="button" aria-label="Zoom to whole estate" onClick="{{ toEstate }}" style="position:absolute;inset:0;border-radius:50%;border:1px solid {{ crumbRing0 }};transition:border-color 250ms" style-hover="border-color:#39ff14"></button>
        <button type="button" aria-label="Zoom to domain" onClick="{{ toDomain }}" style="position:absolute;inset:10px;border-radius:50%;border:1px {{ crumbDash1 }} {{ crumbRing1 }};transition:border-color 250ms" style-hover="border-color:#39ff14"></button>
        <div style="position:absolute;inset:20px;border-radius:50%;border:1px {{ crumbDash2 }} {{ crumbRing2 }};background:{{ crumbFill2 }};pointer-events:none;transition:all 250ms"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#8b95a3;white-space:nowrap">{{ levelLabel }}</div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase">
          <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="1">
            <span style="color:#8b95a3">{{ c.sep }}</span><button type="button" onClick="{{ c.onClick }}" style="color:{{ c.color }};text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap" style-hover="color:#39ff14">{{ c.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="text-align:right;display:flex;flex-direction:column;gap:3px">
      <div style="font-size:15px;font-weight:500;letter-spacing:-0.01em;color:#c8d0dc">The Seitiate Estate</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#8b95a3;white-space:nowrap">A PLAIN-ENGLISH MAP · 8 NOV 2026</div>
    </div>
  </div>

  <div style="flex:none;height:32px;border-top:1px solid rgba(57,255,20,0.08);background:#0e1015;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#a8b1be;white-space:nowrap;overflow:hidden">
    <div style="display:flex;align-items:center;gap:16px">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#39ff14;box-shadow:0 0 8px rgba(57,255,20,0.6)"></span>WORKING TODAY {{ totLive }}</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#d4a574"></span>PARTLY READY {{ totFlight }}</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;border:1px dashed #60a5fa"></span>PLANNED {{ totPlanned }}</span>
    </div>
    <div style="color:#8b95a3">{{ hint }}</div>
  </div>
</div>
</template>
<script>

       var ref=ins.length?ins[ins.length-1].nodes[ins[ins.length-1].nodes.length-1].nextSibling:a.nextSibling;a.parentNode.insertBefore(c,ref);ins[i]={nodes:ns,b:b}}
      else ins[i].b(sc)})});
   }else{var vp=n.getAttribute('value').match(/[\w.$]+/)[0],cur=null;
    ups.push(function(s){var v=!!get(s,vp);
     if(v&&!cur){var c=f.cloneNode(true),b=compile(c);b(s);var ns=[].slice.call(c.childNodes);a.parentNode.insertBefore(c,a.nextSibling);cur={nodes:ns,b:b}}
     else if(v)cur.b(s);
     else if(cur){cur.nodes.forEach(function(x){x.remove()});cur=null}});
   }return}
  [].slice.call(n.attributes).forEach(function(at){var nm=at.name,val=at.value;
   if(nm==='style-hover'){n.removeAttribute(nm);var c='h'+(++H);sheet.textContent+='.'+c+':hover{'+val.replace(/;?\s*$/,'').split(';').join(' !important;')+' !important}';n.classList.add(c);return}

class Component extends DCLogic {
  static ST = {

  state = { W: 1200, H: 760, focus: null, lens: null, phase: 'open', more: null };

  constructor(p) {
    super(p);
    const idx = { core: { kind: 'core', name: 'You & Your Seity', st: 'flight' } };
    Component.DOMAINS.forEach(dm => {
      idx[dm.id] = { kind: 'domain', name: dm.t, dom: dm.id };
      dm.subs.forEach(s => { idx[s.id] = { kind: 'sub', name: s.s, dom: dm.id, st: s.st }; });
    });
    this.idx = idx;
  }

  measure = () => {
    const el = this._el || document.querySelector('[data-estate-stage]');
    let W = 0, H = 0;
    if (el) { const r = el.getBoundingClientRect(); W = r.width; H = r.height; }
    if (W < 50 || H < 50) { W = window.innerWidth; H = window.innerHeight - 32; }
    if (W < 50 || H < 50) return;
    if (Math.abs(W - this.state.W) > 1 || Math.abs(H - this.state.H) > 1) this.setState({ W, H });
  };
  componentDidUpdate() {
    if (this._el) {
      const r = this._el.getBoundingClientRect();
      if (r.width >= 50 && r.height >= 50 && (Math.abs(r.width - this.state.W) > 1 || Math.abs(r.height - this.state.H) > 1)) {
        clearTimeout(this._mt); this._mt = setTimeout(this.measure, 0);
      }
    }
  }
  componentDidMount() {
    this._ro = new ResizeObserver(() => this.measure());
    const el = this._el || document.querySelector('[data-estate-stage]');
    if (el) { this._el = el; this._ro.observe(el); }
    this._ro.observe(document.documentElement);
    window.addEventListener('resize', this.measure);
    this.measure();
    const t0 = performance.now();
    const loop = () => { this.measure(); if (performance.now() - t0 < 1500) this._raf = requestAnimationFrame(loop); };
    this._raf = requestAnimationFrame(loop);
    this._iv = setInterval(this.measure, 1000);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearInterval(this._iv); this._ro && this._ro.disconnect(); window.removeEventListener('resize', this.measure); }

  stageRef = el => {
    if (el && el !== this._el) {
      this._el = el;
      if (this._ro) this._ro.observe(el);
      setTimeout(this.measure, 0);
    }
  };

  back = () => {
    const { focus, lens } = this.state;
    if (lens) this.setState({ lens: null, more: null });
    else if (focus) this.setState({ focus: null });
  };

  openLens(focus, lens) {
    this.setState({ focus, lens, phase: 'from' }, () => {
      clearTimeout(this._pt);
      this._pt = setTimeout(() => this.setState({ phase: 'open' }), 40);
    });
  }

  go(id) {
    const t = this.idx[id];
    if (!t) return;
    if (t.kind === 'core') this.openLens(null, 'core');
    else if (t.kind === 'domain') this.setState({ focus: id, lens: null });
    else this.openLens(t.dom, id);
  }

  layout() {
    const { W, H, focus, lens } = this.state;
    const D = Component.DOMAINS;
    const cx = W / 2, cy = H / 2 + 14;
    const u = Math.max(150, Math.min(W / 2 - 20, H / 2 - 50) / 0.92);
    const P = {}, R = {};
    const A = i => -Math.PI / 2 + i * Math.PI / 3;
    const pol = (x, y, r, a) => [x + r * Math.cos(a), y + r * Math.sin(a)];
    let lensD = 0;
    if (!focus) {
      const L = lens === 'core';
      P.core = L ? { x: cx, y: cy, d: 0.3 * u, o: 0, lm: 'inside' } : { x: cx, y: cy, d: 0.42 * u, o: 1, lm: 'inside' };
      const Rr = L ? 0.86 * u : 0.66 * u;
      R.estate = { x: cx, y: cy, rx: Rr, ry: Rr, o: L ? 0.5 : 1, dash: 'solid' };
      D.forEach((dm, i) => {
        const dd = L ? 0.15 * u : 0.32 * u;
        const [x, y] = pol(cx, cy, Rr, A(i));
        P[dm.id] = { x, y, d: dd, o: L ? 0.6 : 1, lm: L ? 'below' : 'inside' };
        const orb = dd / 2 + 0.06 * u;
        R['o-' + dm.id] = { x, y, rx: orb, ry: orb, o: L ? 0 : 0.8, dash: 'dashed' };
        dm.subs.forEach((s, k) => {
          const [sx, sy] = pol(x, y, orb, A(i) + k * 2 * Math.PI / dm.subs.length);
          P[s.id] = { x: sx, y: sy, d: 7, o: L ? 0 : 0.9, lm: 'none', dot: true };
        });
      });
      if (L) lensD = 2 * (Rr - 0.075 * u) - 28;
    } else {
      const i = D.findIndex(d => d.id === focus), a = A(i), dm = D[i], n = dm.subs.length, L = !!lens;
      const rx = Math.max(120, W / 2 - 84), ry = Math.max(120, H / 2 - 84);
      R.estate = { x: cx, y: cy, rx, ry, o: L ? 0.35 : 0.7, dash: 'solid' };
      const sr = L ? Math.min(0.8 * u, ry - 0.04 * u) : 0.6 * u;
      const sd = L ? Math.min(0.13 * u, 0.6 * 2 * Math.PI * sr / n) : Math.min(0.25 * u, 0.78 * 2 * Math.PI * sr / n);
      R['o-' + focus] = { x: cx, y: cy, rx: sr, ry: sr, o: 1, dash: 'dashed' };
      P[focus] = L ? { x: cx, y: cy, d: 0.3 * u, o: 0, lm: 'inside' } : { x: cx, y: cy, d: 0.38 * u, o: 1, lm: 'inside', center: true };
      dm.subs.forEach((s, k) => {
        const [sx, sy] = pol(cx, cy, sr, -Math.PI / 2 + k * 2 * Math.PI / n);
        const sel = s.id === lens;
        P[s.id] = { x: sx, y: sy, d: sel ? sd * 1.3 : sd, o: L ? (sel ? 1 : (lens === focus ? 0.85 : 0.5)) : 1, lm: L ? 'none' : 'inside', sel };
      });
      for (let j = 1; j < 6; j++) {
        const o = D[(i + j) % 6];
        const ang = a + Math.PI + (j - 3) * 0.62;
        const x = cx + rx * Math.cos(ang), y = cy + ry * Math.sin(ang);
        P[o.id] = { x, y, d: 0.12 * u, o: L ? 0.4 : 0.8, lm: 'below', peri: true };
        R['o-' + o.id] = { x, y, rx: 0.06 * u + 6, ry: 0.06 * u + 6, o: 0, dash: 'dashed' };
        o.subs.forEach(s => { P[s.id] = { x, y, d: 2, o: 0, lm: 'none', dot: true }; });
      }
      const ca = a + Math.PI;
      P.core = { x: cx + (rx + 300) * Math.cos(ca), y: cy + (ry + 300) * Math.sin(ca), d: 0.2 * u, o: 0, lm: 'none' };
      if (L) lensD = 2 * (sr - sd / 2) - 28;
    }
    return { P, R, cx, cy, u, lensD };
  }

  counts(dm) {
    const c = { live: 0, flight: 0, planned: 0 };
    dm.subs.forEach(s => c[s.st]++);
    return c;
  }

  renderVals() {
    const ST = Component.ST, D = Component.DOMAINS, CORE = Component.CORE;
    const { focus, lens, phase, W, H } = this.state;
    const Partner Vertical = false;
    const showLinks = this.props.showLinks ?? true;
    const { P, R, cx, cy, u, lensD } = this.layout();
    const stop = e => e.stopPropagation();
    const click = fn => e => { e.stopPropagation(); fn(); };

    const nodes = [];
    const push = (id, kind, info) => {
      const p = P[id];
      const d = Math.max(p.d, 1);
      const bw = (kind === 'core' ? 1.5 : 1) * 100 / d;
      const st = ST[info.st || 'live'];
      const dim = Partner Vertical && !info.Partner Vertical ? 0.22 : 1;
      let bg = '#0e1015', border, shadow = 'none';
      if (p.dot) { bg = st.c; border = 'none'; }
      else if (kind === 'core') { bg = '#161a22'; border = `${bw}px solid rgba(57,255,20,0.55)`; shadow = '0 0 60px rgba(57,255,20,0.14)'; }
      else if (kind === 'domain') { border = `${bw}px solid ${p.center ? 'rgba(57,255,20,0.45)' : 'rgba(200,208,220,0.2)'}`; if (p.center) shadow = '0 0 50px rgba(57,255,20,0.1)'; }
      else { border = `${bw}px ${st.dash} ${p.sel ? st.c : st.a}`; if (p.sel) shadow = `0 0 30px ${st.g}`; }
      const inside = p.lm === 'inside';
      let fs = 12, kicker = '', kc = '#8b95a3', nc = '#c8d0dc', name = info.name, cnt = null;
      if (kind === 'core') { fs = Math.min(19, d * 0.15); kicker = d > 150 ? 'Start here' : ''; kc = '#39ff14'; }
      else if (kind === 'domain') {
        cnt = d > 112 ? info.c : null;
        if (inside) { fs = Math.min(p.center ? 20 : 14.5, d * (p.center ? 0.14 : 0.135)); kicker = d > 118 ? info.kicker : ''; }
        else { fs = 11; nc = '#a8b1be'; cnt = null; }
      } else { fs = Math.max(9.5, Math.min(12.5, d * 0.125)); kicker = d > 82 ? st.short : ''; kc = st.c; }
      const lw = inside ? d * 0.78 : 140;
      nodes.push({
        aria: info.name,
        tf: `translate(${p.x - 50}px, ${p.y - 50}px) scale(${d / 100})`,
        o: p.o * dim, pe: p.o > 0.05 ? 'auto' : 'none',
        bg, border, shadow,
        ltf: inside ? `translate(${p.x}px, ${p.y}px) translate(-50%, -50%)` : `translate(${p.x}px, ${p.y + d / 2 + 8}px) translate(-50%, 0)`,
        lw, lo: p.lm === 'none' ? 0 : p.o * dim,
        kicker, kc, nc, fs, name,
        counts: !!cnt, cl: cnt ? cnt.live : 0, cf: cnt ? cnt.flight : 0, cp: cnt ? cnt.planned : 0,
        onClick: click(info.onClick)
      });
    };

    push('core', 'core', { name: CORE.t, st: 'flight', Partner Vertical: true, onClick: () => focus ? this.setState({ focus: null, lens: null }) : this.openLens(null, 'core') });
    D.forEach((dm, i) => {
      push(dm.id, 'domain', {
        name: dm.t, Partner Vertical: dm.subs.some(s => s.Partner Vertical), c: this.counts(dm),
        kicker: `${dm.subs.length} parts`,
        onClick: () => (focus === dm.id ? (lens === dm.id ? this.setState({ lens: null }) : this.openLens(dm.id, dm.id)) : this.setState({ focus: dm.id, lens: null }))
      });
    });
    D.forEach(dm => dm.subs.forEach(s => {
      push(s.id, 'sub', { name: s.s, st: s.st, Partner Vertical: s.Partner Vertical, onClick: () => (lens === s.id ? this.setState({ lens: null }) : this.openLens(dm.id, s.id)) });
    }));

    const rings = Object.keys(R).map(k => {
      const r = R[k];
      return { w: r.rx * 2, h: r.ry * 2, tf: `translate(${r.x - r.rx}px, ${r.y - r.ry}px)`, o: r.o, dash: r.dash };
    });

    // lens
    let L = null;
    if (lens === 'core') L = { ...CORE, linkTitle: 'THE SIX WHEELS AROUND YOU', links: D.map(d => d.id) };
    else if (lens && focus === lens) { const dm = D.find(d => d.id === lens); const c = this.counts(dm); L = { t: dm.t, eb: dm.eb, d: dm.d, st: c.live === dm.subs.length ? 'live' : c.planned === dm.subs.length ? 'planned' : 'flight', b: dm.b, stage: `${c.live} working today · ${c.flight} partly ready · ${c.planned} planned, across ${dm.subs.length} parts.`, linkTitle: 'THE PARTS OF THIS WHEEL', links: dm.subs.map(s => s.id) }; }
    else if (lens) { const dm = D.find(d => d.id === focus); const s = dm.subs.find(x => x.id === lens); L = { ...s, eb: dm.t, linkTitle: 'CONNECTED TO', links: s.l }; }
    const lensObj = L ? (() => {
      const st = ST[L.st];
      return {
        eyebrow: L.eb, title: L.t, desc: L.d, stLabel: st.label, sc: st.c, dash: st.dash, bc: st.a, glow: st.g, noChip: false,
        hasCloser: !!(L.b && L.b.length),
        notes: L.n || [], hasNotes: !!(L.n && L.n.length),
        loop: L.loop || '', hasLoop: !!L.loop,
        stage: L.stage || '', hasStage: !!L.stage,
        bounds: this.state.more === lens ? (L.b || []) : [], hasBounds: this.state.more === lens && !!(L.b && L.b.length),
        linkTitle: L.linkTitle,
        links: (L.links || []).filter(id => this.idx[id]).map(id => {
          const t = this.idx[id];
          const domName = t.dom && t.dom !== focus ? D.find(d => d.id === t.dom).t.toUpperCase() : (t.kind === 'core' ? 'CORE' : '');
          return { name: t.name, dom: t.kind === 'sub' ? domName : '', c: t.st ? ST[t.st].c : '#c8d0dc', onClick: click(() => this.go(id)) };
        })
      };
    })() : { eyebrow: '', title: '', desc: '', stLabel: '', sc: '#8b95a3', dash: 'solid', bc: 'transparent', glow: 'transparent', notes: [], links: [], bounds: [], linkTitle: '', loop: '', stage: '', hasNotes: false, hasLoop: false, hasStage: false, hasBounds: false, hasCloser: false, noChip: false };

    const card = (this.props.lensStyle === 'card') || lensD < 360;
    const lensW = card ? Math.min(480, W - 40) : lensD;
    const origin = lens && lens !== 'core' && lens !== focus && P[lens] ? P[lens] : { x: cx, y: cy };
    let lensTf = 'translate(-50%, -50%) scale(0.86)', lensTr = 'transform 620ms cubic-bezier(0,0,0.2,1), opacity 420ms cubic-bezier(0,0,0.2,1)';
    if (lens && phase === 'from') { lensTf = `translate(calc(-50% + ${origin.x - cx}px), calc(-50% + ${origin.y - cy}px)) scale(0.12)`; lensTr = 'none'; }
    else if (lens) lensTf = 'translate(-50%, -50%) scale(1)';

    // connection lines
    const lines = [];
    if (lens && phase === 'open' && showLinks) {
      const from = lens === 'core' || lens === focus ? { x: cx, y: cy } : P[lens];
      const ids = lens === 'core' ? D.map(d => d.id) : lens === focus ? [] : (L.l || []);
      const seen = new Set();
      const add = (a, b, strong) => {
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
        if (len < 4) return;
        lines.push({ w: len, tf: `translate(${a.x}px, ${a.y}px) rotate(${Math.atan2(dy, dx)}rad)`, bg: strong ? 'linear-gradient(90deg, rgba(57,255,20,0.5), rgba(57,255,20,0.15))' : 'linear-gradient(90deg, rgba(57,255,20,0.35), rgba(57,255,20,0.04))' });
      };
      if (lens !== 'core' && lens !== focus) add({ x: cx, y: cy }, from, true);
      ids.forEach(id => {
        const t = this.idx[id]; if (!t || t.kind === 'core') return;
        const target = t.kind === 'sub' && t.dom === focus ? id : t.dom || id;
        if (seen.has(target) || target === lens) return; seen.add(target);
        if (P[target]) add(from, P[target], false);
      });
    }

    const fd = focus ? D.find(d => d.id === focus) : null;
    const crumbs = [{ sep: '', label: 'Whole picture', color: focus || lens ? '#a8b1be' : '#39ff14', onClick: click(() => this.setState({ focus: null, lens: null })) }];
    if (fd) crumbs.push({ sep: '/', label: fd.t, color: lens ? '#a8b1be' : '#39ff14', onClick: click(() => this.setState({ lens: null })) });
    if (lens) crumbs.push({ sep: '/', label: lens === 'core' ? 'You & Your Seity' : lens === focus ? 'Overview' : this.idx[lens].name, color: '#39ff14', onClick: stop });
    const depth = lens ? 2 : focus ? 1 : 0;

    let tl = 0, tf = 0, tp = 0;
    D.forEach(dm => { const c = this.counts(dm); tl += c.live; tf += c.flight; tp += c.planned; });

    return {
      toggleCloser: click(() => this.setState({ more: this.state.more === lens ? null : lens })),
      closerLabel: this.state.more === lens ? '− LESS DETAIL' : '+ LOOK CLOSER',
      stageRef: this.stageRef, stop, back: click(this.back),
      onStage: () => this.back(),
      stageCursor: depth ? 'zoom-out' : 'default',
      cx, cy, nodes, rings, lines, lens: lensObj,
      lensW, lensH: card ? 'auto' : lensD + 'px', lensMaxH: card ? H - 120 : lensD, lensR: card ? '10px' : '50%',
      innerW: card ? lensW - 56 : lensD * 0.7, innerH: card ? H - 130 : lensD * 0.8,
      lensTf, lensTr, lensO: lens ? (phase === 'from' ? 0 : 1) : 0, lensPE: lens ? 'auto' : 'none',
      toEstate: click(() => this.setState({ focus: null, lens: null })),
      toDomain: click(() => { if (focus) this.setState({ lens: null }); }),
      crumbRing0: depth === 0 ? '#39ff14' : '#a8b1be',
      crumbRing1: depth === 1 ? '#39ff14' : depth > 1 ? '#a8b1be' : '#8b95a3', crumbDash1: depth >= 1 ? 'solid' : 'dashed',
      crumbRing2: depth === 2 ? '#39ff14' : '#8b95a3', crumbDash2: depth >= 2 ? 'solid' : 'dashed', crumbFill2: depth === 2 ? 'rgba(57,255,20,0.12)' : 'transparent',
      levelLabel: depth === 0 ? 'THE WHOLE PICTURE' : depth === 1 ? 'ONE WHEEL' : 'CLOSE UP',
      crumbs,
      totLive: tl, totFlight: tf, totPlanned: tp,
      hint: depth === 0 ? 'START IN THE MIDDLE · CLICK ANY CIRCLE TO ZOOM IN' : 'CLICK THE BACKGROUND TO ZOOM OUT'
    };
  }
}

__mount(Component);
</script>
</body>
</html>
