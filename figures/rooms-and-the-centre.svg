<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="680" height="810" role="img">
<title>The 4-layer composable architecture: Entrance, Sibling Product Collections, Shared Composable Apps, and the Minimal Seitiate Centre</title>
<desc>Layer 1 is the Entrance (Seitiate+ for one sign-in, SEIT billing, and channel routing). Layer 2 holds the two Sibling Product Collections (Sakme for independent creatives and specialists, and Scientific Platform / Research Hub for researchers and funded laboratories), which are audience and entry doors rather than isolated silos. Layer 3 holds the Shared Composable Apps (in both Sovereign and Cloud tiers) accessed by both sibling products: Seity (with the Argon Personal Assistant, Question Compiler, Playful Discovery, and Harvester), Binder and Writing Desk, Evidence Foundry (evidence.v1), and Maker's Workbench. Layer 4 connects through the 8 fixed HTTP interfaces to the Minimal Seitiate Centre (Identity, Memory Codex/Canon, Secrets Vault and Model Router, Ledger and Notary, Sharing, and Messaging).</desc>
<style>
  .bg { fill: #FAF9F5; }
  .t  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1F1E1B; }
  .th { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F1E1B; }
  .ts { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #5F5E5A; }
  .frame { fill: none; stroke: #888780; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .seam { fill: none; stroke: #888780; stroke-width: 0.75; }
  .centre { fill: none; stroke: #534AB7; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .box { fill: #FFFFFF; stroke: #888780; stroke-width: 0.5; }
  .purple > rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; } .purple > .th { fill: #3C3489; } .purple > .ts { fill: #534AB7; }
  .teal > rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; } .teal > .th { fill: #085041; } .teal > .ts { fill: #0F6E56; }
  .core > rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.5; } .core > .th { fill: #085041; } .core > .ts { fill: #0F6E56; }
  .coral > rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; } .coral > .th { fill: #712B13; } .coral > .ts { fill: #993C1D; }
  .gray > rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; } .gray > .th { fill: #444441; } .gray > .ts { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1A1A18; }
    .t, .th { fill: #EEECE4; } .ts { fill: #B4B2A9; }
    .box { fill: #232321; }
    .centre { stroke: #AFA9EC; }
    .purple > rect { fill: #3C3489; stroke: #AFA9EC; } .purple > .th { fill: #CECBF6; } .purple > .ts { fill: #AFA9EC; }
    .teal > rect, .core > rect { fill: #085041; stroke: #5DCAA5; } .teal > .th, .core > .th { fill: #9FE1CB; } .teal > .ts, .core > .ts { fill: #5DCAA5; }
    .coral > rect { fill: #712B13; stroke: #F0997B; } .coral > .th { fill: #F5C4B3; } .coral > .ts { fill: #F0997B; }
    .gray > rect { fill: #444441; stroke: #B4B2A9; } .gray > .th { fill: #D3D1C7; } .gray > .ts { fill: #B4B2A9; }
  }
</style>
<defs>
