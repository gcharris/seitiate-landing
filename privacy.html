<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Privacy — Seitiate</title><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/legal.css"><script src="/assets/gate.js?v=4></script></head><body><header class="site-nav"><a class="wordmark" href="/">seitiate<span>·</span></a><nav class="nav-links" aria-label="Main navigation"><a href="/five-rungs.html">What you can build</a><a href="/early-access.html">Request early access ↗</a></nav></header><main class="legal-wrap"><p class="legal-kicker">SEITIATE / INFORMATION</p><h1>Privacy</h1><p class="legal-date">Updated 13 November 2026</p><h2>About this website</h2><p>Seitiate.com is operated by Agent-C LLC. This notice describes information associated with visiting this introduction website or contacting us.</p><h2>Information when you visit</h2><p>We do not use advertising pixels or third-party marketing trackers on this site. GitHub Pages hosts the website and may process standard operational information, including IP addresses and request logs, to deliver and protect the service.</p><h2 id="activity-panel">Invitation access &amp; the activity panel</h2><p>When you enter the invitation access code or open or refresh the activity panel, we record the interaction time and introduction-link label and, when available, approximate city or country. We use these signals to understand interest in Seitiate and may send a private notification to our team. An IP address is processed to prevent duplicate notifications; this service does not retain the raw address. A daily keyed identifier and basic event details are retained for up to seven days. Notifications delivered to our private inbox may remain there until deleted. We do not use this feature for advertising, and we honour browser Do Not Track and Global Privacy Control signals. Hosting and tunnel providers (GitHub Pages and Cloudflare) may separately process operational request data. Approximate location does not identify an individual or establish who read the site.</p><h2>Your access code</h2><p>After you enter the invitation code, this website stores a small flag in your browser’s local storage to remember that you have entered. It is not an account or a personal profile. You can remove it by clearing this website’s browser data.</p><h2 id="early-access">Early-access requests</h2><p>The early-access form prepares a message in your email app. The details you enter remain in your browser until you choose to send that email; the form does not submit them to our website server or activity service. Requests are addressed to agentcsakme@gmail.com. If you send one, we receive your name, email address, preferred tier, and any description you include, and use them to respond and discuss early access. We do not add you to a marketing mailing list through this form.</p><h2>When you contact us</h2><p>If you email us, we receive the information you choose to send, such as your email address and message. We use it to respond and continue the conversation.</p><h2>Other products</h2><p>This notice covers this website. Separate products and services have their own privacy notices and terms.</p><h2>Contact</h2><p>For privacy questions, write to <a href="mailto:agentcsakme@gmail.com">agentcsakme@gmail.com</a>.</p></main><footer class="wrap"><span>© 2026 Agent-C LLC · Georgia</span><nav aria-label="Footer"><a href="/">Home</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a></nav></footer></body></html>
