<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="/assets/gate.js"></script>
<meta name="theme-color" content="#152b2d"><meta name="description" content="Enter an imagined Scriptorium, approach your desk, and let the room become a place to write.">
<title>Seitiate · The Scriptorium</title>
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body data-view="room">
<main id="experience">
 <section id="world" aria-label="The Scriptorium room">
  <div id="camera"><img id="roomImage" src="assets/room.png" alt="An inhabited Scriptorium, with warm daylight, teal architecture and writing desks." draggable="false"></div>
  <div id="seatedCamera"><img src="assets/room-reference.png" alt="The same family of Writing Desk, viewed from a seated position." draggable="false"></div>
  <div class="world-shade"></div><div class="grain"></div>
  <button id="deskHotspot" class="hotspot" aria-label="Approach your writing desk"><span class="target-ring"><span></span></span><span class="hotspot-label">Your writing desk <span>Approach ↗</span></span></button>
  <div id="worldCaption"><span class="eyebrow">A PLACE TO RETURN TO</span><h1>The Scriptorium</h1><p id="sceneDescription">Your next chapter is just ahead.</p></div>
 </section>
 <header id="worldHeader" class="world-header"><a class="wordmark" href="/" aria-label="Return to the Seitiate index"><span class="emblem">✳</span><span>Seitiate<span class="wordmark-sub">An inhabited workspace</span></span></a><nav class="distances" aria-label="View distance"><button data-go="room" aria-current="step"><span>01</span> Room</button><span class="nav-line"></span><button data-go="desk"><span>02</span> Desk</button><span class="nav-line"></span><button data-go="page"><span>03</span> Page</button></nav><button id="tourButton" class="glass-button">▷ Guided tour</button></header>
 <div id="worldFooter" class="world-footer"><button id="backButton" class="glass-button" hidden>← Step back</button><div class="navigation-hint" id="navigationHint"><span>Drag to look</span><span>↑ Approach</span><span>Esc Back</span></div><div class="footer-right"><span class="concept-note">Interactive concept</span><button id="motionButton" class="icon-button" aria-label="Reduce motion" title="Reduce motion">◉</button><button id="fullscreenButton" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button></div></div>
 <div id="deskPrompt" class="desk-prompt" hidden><span>Make yourself comfortable.</span><button id="openPageButton" class="primary-button">Open your manuscript <span>↗</span></button></div>
 <div id="tourCaption" class="tour-caption" hidden aria-live="polite"></div>
 <section id="workspace" class="workspace" aria-label="Writing Desk" hidden inert></section>
 <div id="toast" role="status" class="toast" hidden></div>
</main>
</body></html>
